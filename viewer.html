<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xem tài liệu · Webstudy</title><style>html,body{margin:0;height:100%;font-family:system-ui;background:#f4f7fb}header{height:58px;background:#fff;border-bottom:1px solid #e5eaf2;display:flex;align-items:center;padding:0 20px;gap:20px}a{color:#2563eb;text-decoration:none;font-weight:700}iframe{width:100%;height:calc(100% - 59px);border:0}.msg{text-align:center;padding:60px;color:#c53030}</style></head><body><header><a href="library.html">← Quay lại thư viện</a><span id="title">Đang tải tài liệu</span></header><div id="content"></div><script>const id=new URLSearchParams(location.search).get('id'),content=document.querySelector('#content');if(!id||!/^[0-9]+$/.test(id))content.innerHTML='<div class="msg">Tài liệu không hợp lệ.</div>';else{const frame=document.createElement('iframe');frame.src='download.php?id='+id;frame.title='Tài liệu';content.append(frame);document.querySelector('#title').textContent='Trình xem tài liệu';}</script></body></html>

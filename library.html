<!DOCTYPE HTML>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Library</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#74b9ff,#0984e3);
    padding:40px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 15px 30px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#2d3436;
    margin-bottom:35px;
    font-size:34px;
}

.category{
    margin-bottom:30px;
}

.file{
    display:block;
    text-decoration:none;
    color:#2d3436;
    background:#f5f6fa;
    margin:10px 0;
    padding:14px 18px;
    border-radius:10px;
    transition:0.25s;
    cursor:pointer;
}

.file:hover{
    background:#d6e4ff;
    color:#0984e3;
    transform:translateX(8px);
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.file .desc{
    display:block;
    font-size:13px;
    color:#636e72;
    margin-top:4px;
}

.empty,.error{
    text-align:center;
    padding:30px;
}

.error{
    color:red;
}
</style>

</head>
<body>

<div class="container">

<h1>Library</h1>

<div id="bookList" class="category">

<div class="empty">
Đang tải...
</div>

</div>

</div>

<script>

const list=document.getElementById("bookList");

fetch("library.php")
.then(r=>r.json())
.then(data=>{

    if(data.error){

        list.innerHTML=`<div class="error">${data.error}</div>`;
        return;

    }

    if(data.length===0){

        list.innerHTML=`<div class="empty">Không có tài liệu.</div>`;
        return;

    }

    list.innerHTML="";

    data.forEach(book=>{

        const a=document.createElement("a");

        a.className="file";

        a.href="#";

        a.innerHTML=`
            <strong>${book.Name}</strong>
            <span class="desc">${book.Description??""}</span>
        `;

        a.onclick=function(e){

            e.preventDefault();

            fetch("library.php?id="+book.Number)

            .then(r=>r.json())

            .then(file=>{

                if(file.error){

                    alert(file.error);
                    return;

                }

                window.location.href=
                "viewer.html?file="+
                encodeURIComponent(file.FILE_PATH);

            });

        };

        list.appendChild(a);

    });

})
.catch(err=>{

    list.innerHTML=
    `<div class="error">${err}</div>`;

});

</script>

</body>
</html>

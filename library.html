<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
        background:linear-gradient(135deg,#74b9ff,#0984e3);
        padding:40px;
    }

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 15px 30px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#2d3436;
    margin-bottom:35px;
    font-size:34px;
}

.category{
    margin-bottom:30px;
}

.file{
    display:block;
    text-decoration:none;
    color:#2d3436;
    background:#f5f6fa;
    margin:10px 0;
    padding:14px 18px;
    border-radius:10px;
    transition:0.25s;
}

.file:hover{
    background:#d6e4ff;
    color:#0984e3;
    transform:translateX(8px);
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.file .desc{
    display:block;
    font-size:13px;
    color:#636e72;
    margin-top:4px;
    font-weight:normal;
}

.empty, .error{
    text-align:center;
    color:#636e72;
    padding:30px;
    font-size:16px;
}

.error{
    color:#d63031;
}
</style>
</head>
<body>
    <div class="container">
        <h1>Library</h1>
        <div class="category" id="bookList">
            <div class="empty">Đang tải sách...</div>
        </div>
    </div>

<script>
fetch('library.php')
    .then(res => res.json())
    .then(data => {
        console.log('Dữ liệu từ library.php:', data); // mở F12 > Console để xem nếu vẫn lỗi
        const listEl = document.getElementById('bookList');

        if (data.error) {
            listEl.innerHTML = `<div class="error">Lỗi: ${data.error}</div>`;
            return;
        }

        if (!Array.isArray(data) || data.length === 0) {
            listEl.innerHTML = `<div class="empty">Chưa có sách nào trong database.</div>`;
            return;
        }

        listEl.innerHTML = data.map(book => {
            // Chuẩn hoá đường dẫn: đổi \ thành /, và encode từng phần cho đúng chuẩn URL
            const safePath = (book.FILE_PATH || '')
                .split('\\').join('/')
                .split('/')
                .map(encodeURIComponent)
                .join('/');

            return `
            <a class="file" href="${safePath}" target="_blank" rel="noopener">
                ${book.Name}
                ${book.Description ? `<span class="desc">${book.Description}</span>` : ''}
            </a>
            `;
        }).join('');
    })
    .catch(err => {
        document.getElementById('bookList').innerHTML =
            `<div class="error">Không gọi được library.php: ${err}</div>`;
    });
</script>
</body>
</html>

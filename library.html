<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thư viện cá nhân · Webstudy</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="dashboard.php">Web<span>study</span></a><nav class="nav"><a href="dashboard.php">⌂ Trang chủ</a><a class="active" href="library.html">▣ Thư viện</a><a href="note.php">✎ Ghi chú</a><a href="settings.php">⚙ Cài đặt</a></nav></header><main class="page"><div class="hero"><div><div class="eyebrow">Không gian riêng</div><h1>Thư viện của bạn</h1><p>Tài liệu bạn tải lên chỉ thuộc về tài khoản của bạn.</p></div><label class="button" for="upload">+ Tải tài liệu lên</label><input id="upload" type="file" hidden accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg"></div><div id="uploadStatus" class="status"></div><div class="toolbar"><input class="search" id="search" placeholder="Tìm kiếm tài liệu..."><span id="count" class="status"></span></div><section id="list" class="doc-list"><div class="empty">Đang tải tài liệu...</div></section></main></div><script>const list=document.querySelector('#list'),search=document.querySelector('#search'),count=document.querySelector('#count'),status=document.querySelector('#uploadStatus');let docs=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function render(){const q=search.value.toLowerCase();const found=docs.filter(x=>(x.Name+' '+(x.Description||'')).toLowerCase().includes(q));count.textContent=found.length+' tài liệu';list.innerHTML=found.length?found.map(x=>`<div class="doc"><a class="doc-main" href="viewer.html?id=${x.Number}"><div class="icon" style="margin:0">▤</div><div class="meta"><strong>${esc(x.Name)}</strong><small>${esc(x.Description||'Tài liệu')} · ${esc(x.CREATED_AT||'')}</small></div></a><button class="icon delete-doc" data-id="${x.Number}" title="Xóa tài liệu">×</button></div>`).join(''):'<div class="empty">Thư viện chưa có tài liệu. Hãy tải file đầu tiên lên.</div>';document.querySelectorAll('.delete-doc').forEach(b=>b.onclick=()=>removeDoc(b.dataset.id))}function load(){fetch('library.php').then(r=>r.json()).then(x=>{if(!Array.isArray(x))throw Error();docs=x;render()}).catch(()=>list.innerHTML='<div class="empty">Không thể tải thư viện.</div>')}function removeDoc(id){if(!confirm('Xóa tài liệu này?'))return;fetch('library.php',{method:'DELETE',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'id='+encodeURIComponent(id)}).then(r=>r.json()).then(x=>{if(x.ok){status.textContent='Đã xóa tài liệu';load()}else status.textContent=x.error||'Xóa thất bại'})}document.querySelector('#upload').onchange=e=>{const file=e.target.files[0];if(!file)return;const data=new FormData();data.append('document',file);status.textContent='Đang tải lên...';fetch('library.php',{method:'POST',body:data}).then(r=>r.json()).then(x=>{status.textContent=x.ok?'Đã tải tài liệu lên':(x.error||'Tải lên thất bại');if(x.ok)load()}).catch(()=>status.textContent='Tải lên thất bại');e.target.value=''};search.oninput=render;load();</script></body></html>

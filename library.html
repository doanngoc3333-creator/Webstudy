<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thư viện · Webstudy</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="dashboard.php">Web<span>study</span></a><nav class="nav"><a href="dashboard.php">⌂ Trang chủ</a><a class="active" href="library.html">▣ Thư viện</a><a href="note.php">✎ Ghi chú</a><a href="settings.php">⚙ Cài đặt</a></nav></header><main class="page"><div class="hero"><div><div class="eyebrow">Kho học liệu</div><h1>Thư viện tài liệu</h1><p>Tìm và mở tài liệu bạn cần cho việc học.</p></div></div><div class="toolbar"><input class="search" id="search" placeholder="Tìm kiếm tài liệu..."><span id="count" class="status"></span></div><section id="list" class="doc-list"><div class="empty">Đang tải tài liệu...</div></section></main></div><script>const list=document.querySelector('#list'),search=document.querySelector('#search'),count=document.querySelector('#count');let docs=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function render(){let q=search.value.toLowerCase();let found=docs.filter(x=>(x.Name+' '+(x.Description||'')).toLowerCase().includes(q));count.textContent=found.length+' tài liệu';list.innerHTML=found.length?found.map(x=>`<a class="doc" href="viewer.html?file=${encodeURIComponent(x.FILE_PATH)}"><div class="icon" style="margin:0">▤</div><div class="meta"><strong>${esc(x.Name)}</strong><small>${esc(x.Description||'Tài liệu PDF')}</small></div><span>→</span></a>`).join(''):'<div class="empty">Không tìm thấy tài liệu phù hợp.</div>'}fetch('library.php').then(r=>r.json()).then(x=>{if(!Array.isArray(x))throw Error();docs=x;render()}).catch(()=>list.innerHTML='<div class="empty">Không thể tải thư viện. Vui lòng thử lại sau.</div>');search.oninput=render;</script></body></html>
